# ====================================================================
# ARSTrader - CONFIGURAÇÃO GLOBAL RESTRITIVA & AGTASTICA DA CORRETORA
# ====================================================================

system:
  environment: "demo"          # demo | production
  heartbeat_timeout: 10           # Segundos tolerados antes do reset do processo filho
  max_signal_latency_ms: 1000     # Idade máxima permitida para o sinal entrar em execução

web_server:
  host: "127.0.0.1"               # IP que a interface web (Dashboard) vai usar
  port: 8080                      # Porta que a interface web (Dashboard) vai usar


# --------------------------------------------------------------------
# ABSTRAÇÃO DE CONEXÕES CCXT
# --------------------------------------------------------------------

exchanges:
  binance:
    enabled: true
    api_key: "${BINANCE_API_KEY}"
    secret: "${BINANCE_SECRET}"
    password:                     # Binance não exige password
    options:
      defaultType: "future"       # future | spot | margin
      adjustForTimeDifference: true

  bybit:
    enabled: false
    api_key: "${BYBIT_API_KEY}"
    secret: "${BYBIT_SECRET}"
    password:
    options:
      defaultType: "linear"

# --------------------------------------------------------------------
# REGRAS DE RISCO FINANCEIRO CENTRALIZADAS (MONOPÓLIO DO CORE)
# --------------------------------------------------------------------

global_risk:
  execution_exchange: "binance"   # A exchange principal onde o Core vai boletar as ordens
  max_daily_loss_pct: 2.0         # Trava de Drawdown Diário. Se atingido, bloqueia novas ordens
  max_simultaneous_trades: 3      # Limite absoluto de posições abertas ao mesmo tempo
  default_stop_loss_pct: 3.0      # Stop Loss padrão configurado globalmente
  default_take_profit_pct: 3.0    # Take Profit padrão configurado globalmente
  trade_risk_percentage: 0.1      # Fração (10%) do saldo disponível em conta usada para abertura de cada ordem
  max_daily_loss_limit: 2.0       # Limite máximo de perda financeira diária permitida (ex: 100.0 USDT)
  default_safety_stop_loss_pct: 3.0 # Stop Loss de segurança padrão para ordens de fechamento manual

# --------------------------------------------------------------------
# REGISTRO, ROTEAMENTO E RESTRIÇÕES ESPECÍFICAS DE MÓDULOS
# --------------------------------------------------------------------

modules:

  # Estratégia Avançada Estrela da Manhã
  morningstar:
    enabled: true
    path: "morningstar"       # Corresponde à pasta modules/morningstar
    class_name: "MorningStar"  # Classe principal dentro do runner.py exposta no __init__.py
    heartbeat_interval: 5
    restrictions:
      target_markets: "*/USDT"
      allowed_exchanges: "*"
      activation_time: "07:00:00"
      standby_time:               # null = não entra em modo stand-by automaticamente


  # Estratégia Avançada Estrela da Tarde
  eveningstar:
    enabled: true
    path: "eveningstar"       # Corresponde à pasta modules/eveningstar
    class_name: "EveningStar"  # Classe principal dentro do runner.py exposta no __init__.py
    heartbeat_interval: 5
    restrictions:
      target_markets: "*/USDT"
      allowed_exchanges: "*"
      activation_time: "07:00:00"
      standby_time:               # null = não entra em modo stand-by automaticamente
