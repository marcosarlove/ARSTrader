assets:
  - BTC/USDT
  - ETH/USDT
  - BNB/USDT

timeframe: 4h
check_interval: 60
candle_limit: 100

exchange: binance
market: FUTURES
order_response_timeout: 300

reward_risk_ratio: 2.0
support_tolerance_pct: 0.005
stop_buffer_pct: 0.001
long_body_ratio: 1.2
star_body_ratio: 0.35

filters:
  volume:
    enabled: false
    lookback: 20
    recovery_min_ratio: 1.2

  volatility:
    enabled: false
    atr_period: 14
    max_atr_pct: 0.03

  trend:
    enabled: false
    ema_fast: 20
    ema_slow: 50
    require_prior_downtrend: true

  momentum:
    enabled: false
    rsi_period: 14
    max_rsi: 45

  risk:
    enabled: false
    max_signal_risk_pct: 0.02

  cooldown:
    enabled: false
    candles: 3

fetcher:
  exchange_id: binance
  exchange_options:
    apiKey: ${MORNINGSTAR_BINANCE_API_KEY:}
    secret: ${MORNINGSTAR_BINANCE_SECRET:}
    options:
      defaultType: future
  ohlcv_params: {}

scenario_wrapper:
  enabled: true
  probability: 1.0
  cooldown_cycles: 0
  seed:
  scenarios:
    valid_signal:
      enabled: true
      weight: 1
      stop_distance_pct: [0.2, 0.25]
      candle_range_pct: [0.35, 0.9]
    excessive_risk:
      enabled: false
    low_volume:
      enabled: false
    high_volatility:
      enabled: false
    no_signal:
      enabled: false
